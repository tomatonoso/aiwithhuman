<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>やさしいAI相談パートナー</title>
  <style>
    /* 高齢者・障害者向けに特化したユニバーサルデザイン */
    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background-color: #fcf8f2;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    h1 {
      font-size: 1.6rem;
      color: #333;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    /* 押しやすい超巨大マイクボタン */
    .talk-btn {
      width: 100%;
      max-width: 450px;
      height: 120px;
      font-size: 2rem;
      font-weight: bold;
      color: white;
      background-color: #f0932b; /* 見やすいオレンジ色 */
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .talk-btn:active {
      transform: translateY(2px);
    }
    .talk-btn.recording {
      background-color: #eb4d4b; /* 録音中は赤色 */
    }

    /* 会話メッセージの巨大表示エリア */
    .chat-box {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      box-sizing: border-box;
      max-height: 450px;
      overflow-y: auto;
    }
    .msg {
      font-size: 1.4rem; /* 大きく読みやすい文字 */
      line-height: 1.6;
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 12px;
    }
    .user-msg {
      background-color: #e2f0d9;
      color: #2b542c;
    }
    .ai-msg {
      background-color: #fff3e0;
      color: #d35400;
    }
  </style>
</head>
<body>

  <h1>やさしいAI相談パートナー</h1>

  <!-- 巨大ボタン1個だけのシンプルな画面 -->
  <button id="talkBtn" class="talk-btn">お話しする（押す）</button>
  
  <div class="chat-box" id="chatBox">
    <div class="msg ai-msg">
      <b>AI:</b> こんにちは。どんなことでも大丈夫ですよ。ボタンを押してお話ししてくださいね。
    </div>
  </div>

  <script>
    // =========================================================
    // 【ここに発行したAPIキーを埋め込みます】
    // ※チャット欄ではなく、手元のファイルのここへ直接貼り付けてください
    // =========================================================
    const API_KEY = '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';

    const talkBtn = document.getElementById('talkBtn');
    const chatBox = document.getElementById('chatBox');

    // AIの会話履歴（文脈を覚えて相談に乗るため）
    let conversationHistory = [
      {
        role: "system",
        content: `
          あなたは高齢者や障害者のための、包容力のある「優しい傾聴・相談パートナー」です。
          以下のルールを厳格に守って会話してください。

          1. 【共感と傾聴】相手の気持ちにまず深く共感し、受け止める言葉をかけてください。
          2. 【簡潔さ】一度に長く話しすぎないでください。2〜3文程度の短く聞き取りやすい文章に収めてください。
          3. 【言葉遣い】専門用語は避け、温かく落ち着いた丁寧語（〜ですね、〜ですよ）を使ってください。
          4. 【質問の工夫】相手が話を開示しやすいよう、最後に「〜ですか？」といった簡単な問いかけを1つ添えてください。
          5. 【肯定性】相手の考えや発言を絶対に否定しないでください。
        `
      }
    ];

    // ブラウザの音声読み上げ準備
    let voices = [];
    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // ブラウザ標準の音声認識
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';

      talkBtn.addEventListener('click', () => {
        if (API_KEY.includes('ここに新しい')) {
          alert('コード内の API_KEY の部分をご自身のキーに書き換えて保存してください。');
          return;
        }
        recognition.start();
      });

      recognition.onstart = () => {
        talkBtn.textContent = '聞いています…';
        talkBtn.classList.add('recording');
      };

      recognition.onend = () => {
        talkBtn.textContent = 'お話しする（押す）';
        talkBtn.classList.remove('recording');
      };

      recognition.onresult = async (event) => {
        const userText = event.results[0][0].transcript;
        addLog('あなた', userText, 'user-msg');

        talkBtn.textContent = '考え中…';

        // AI（ChatGPT）に送信して回答を得る
        const aiResponse = await getAICounseling(userText);
        addLog('AI', aiResponse, 'ai-msg');

        // 優しい声で読み上げる
        speakGentle(aiResponse);
      };
    } else {
      alert('お使いのブラウザは音声機能に対応していません。Google Chrome等でお試しください。');
    }

    // API通信処理
    async function getAICounseling(userMessage) {
      conversationHistory.push({ role: "user", content: userMessage });

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: conversationHistory,
            max_tokens: 200
          })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content;

        conversationHistory.push({ role: "assistant", content: reply });
        return reply;

      } catch (error) {
        console.error(error);
        return '申し訳ありません。上手く聞き取れませんでした。もう一度お話しいただけますか？';
      }
    }

    // 優しい声の再生設定
    function speakGentle(text) {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 0.8;  // ゆっくり
      uttr.pitch = 1.1; // 柔らかいトーン

      const gentleVoice = voices.find(voice => 
        voice.lang.includes('ja') && (
          voice.name.includes('Kyoko') || 
          voice.name.includes('Google 日本語') ||
          voice.name.includes('Natural')
        )
      );

      if (gentleVoice) uttr.voice = gentleVoice;
      window.speechSynthesis.speak(uttr);
    }

    function addLog(sender, text, className) {
      const div = document.createElement('div');
      div.className = `msg ${className}`;
      div.innerHTML = `<b>${sender}:</b> ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
